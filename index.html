<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<meta name="description" content="PS5 Radar: lanzamientos, análisis y ofertas de PlayStation 5.">
<link rel="manifest" href="manifest.json">
<title>PS5 Radar · Datos en directo</title>
<style>
:root{--bg:#0b0e14;--panel:#141925;--panel2:#1a2130;--text:#f5f7fb;--muted:#9ba7bc;--line:#293245;--accent:#b8f35a;--purple:#a995ff;--red:#ff7185;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#202c47 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:92px}
header{padding:22px 18px 14px;position:sticky;top:0;background:rgba(11,14,20,.92);backdrop-filter:blur(16px);z-index:5;border-bottom:1px solid #222b3b}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#6cbf52);display:grid;place-items:center;color:#0a1110;font-weight:950;font-size:19px;box-shadow:0 5px 25px #a4ed4b26}
h1{font-size:20px;margin:0;letter-spacing:-.5px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.status{font-size:10px;color:var(--accent);border:1px solid #425a31;padding:5px 8px;border-radius:999px;white-space:nowrap}
main{max-width:760px;margin:auto;padding:18px 14px}.welcome{padding:20px;border:1px solid #30394a;border-radius:22px;background:linear-gradient(135deg,#1c2940,#151b29 70%);margin-bottom:20px;position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:#b8f35a12;right:-40px;top:-60px}.eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.welcome h2{font-size:26px;line-height:1.1;margin:8px 0}.welcome p{color:#c0c9d8;font-size:13px;max-width:420px;margin:0 0 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d1320a6;border:1px solid #344056;border-radius:13px;padding:10px}.stat b{font-size:20px;display:block}.stat span{font-size:10px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}.section-head h3{margin:0;font-size:17px}.small-link{color:var(--accent);font-size:12px;background:none;border:0;padding:4px}
.searchrow{display:flex;gap:8px;margin:12px 0}.searchrow input{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--text);font:inherit;outline:none}.searchrow input:focus{border-color:var(--accent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 7px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--panel);color:#c0c9d8;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:12px}.chip.active{background:var(--accent);color:#10150d;border-color:var(--accent);font-weight:800}
.cards{display:grid;gap:10px}.game{display:flex;gap:12px;background:linear-gradient(130deg,#171e2b,#121722);border:1px solid var(--line);border-radius:17px;padding:12px;min-width:0}.cover{width:82px;min-width:82px;height:112px;border-radius:12px;background:linear-gradient(150deg,#364a66,#151c2b);display:flex;align-items:end;padding:8px;font-size:10px;font-weight:900;letter-spacing:.5px;color:#f5f7fb;overflow:hidden;position:relative}.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,#ffffff30,transparent 40%),linear-gradient(0deg,#070a10cc,transparent 80%)}.cover span{position:relative}.gcontent{flex:1;min-width:0}.gtitle{font-size:15px;font-weight:800;margin:1px 0 5px}.meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tag{font-size:10px;border-radius:5px;background:#252f42;padding:3px 6px;color:#d6deec}.tag.green{background:#26371f;color:var(--accent)}.desc{font-size:12px;color:#b7c1d1;margin:0 0 10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #3a465b;border-radius:9px;background:#20293a;color:var(--text);padding:8px 10px;font-size:11px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#11160d}.btn.saved{border-color:var(--accent);color:var(--accent)}.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-size:13px}
.notice{font-size:11px;color:var(--muted);background:#171d29;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:13px}
.monthbar{display:flex;gap:8px;align-items:center}.monthbar select,.setting input,.setting select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(15,19,28,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));max-width:760px;margin:auto}.nav button{border:0;background:none;color:#7f8ca3;font-size:10px;padding:7px 2px;display:grid;justify-items:center;gap:4px}.nav button strong{font-size:19px;font-weight:500}.nav button.active{color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:10px}.panel h3{margin:0 0 8px;font-size:15px}.panel p{margin:0;color:var(--muted);font-size:12px}.setting{display:grid;gap:7px;margin:12px 0}.setting label{font-size:12px;color:var(--muted)}.setting input{width:100%}.setting button{width:100%}
.footer{font-size:10px;color:#748097;text-align:center;padding:18px 6px}.live-note{font-size:11px;color:var(--muted);margin:8px 2px 12px}.source-label{font-size:10px;color:var(--accent);margin-top:5px}.hide{display:none!important}
@media(min-width:600px){main{padding:24px}.cards{grid-template-columns:1fr 1fr}.game{align-items:flex-start}.welcome h2{font-size:32px}}
</style>
</head>
<body>
<header><div class="topline"><div class="brand"><div class="logo">R</div><div><h1>PS5 RADAR</h1><div class="sub">Tu radar personal de videojuegos</div></div></div><span class="status" id="liveStatus">● CONECTANDO…</span></div></header>
<main id="app"></main>
<nav class="nav">
<button data-tab="inicio" class="active"><strong>⌂</strong>Inicio</button>
<button data-tab="lanzamientos"><strong>▦</strong>Estrenos</button>
<button data-tab="analisis"><strong>◉</strong>Análisis</button>
<button data-tab="ofertas"><strong>％</strong>Ofertas</button>
</nav>
<script>
let liveReleases=[], liveReviews=[], liveOffers=[], lastUpdated=null, apiErrors=[];
const games=[
{id:"hellraiser",name:"Hellraiser: Revival",genre:"Terror",type:"Próximo lanzamiento",date:"2026",price:null,score:null,desc:"Survival horror oscuro inspirado en el universo Hellraiser. Comprueba la fecha oficial antes de planificar la compra.",url:"https://www.playstation.com/es-es/ps5/games/",store:"https://store.playstation.com/es-es/",color:"#49313c"},
{id:"ill",name:"ILL",genre:"Terror / FPS",type:"Próximo lanzamiento",date:"Por confirmar",price:null,score:null,desc:"Terror en primera persona, criaturas grotescas y ambientación opresiva.",url:"https://store.steampowered.com/",store:"https://store.playstation.com/es-es/",color:"#503a32"},
{id:"re9",name:"Resident Evil Requiem",genre:"Terror / Acción",type:"Lanzamiento",date:"Consultar fecha oficial",price:null,score:null,desc:"Nueva entrega de survival horror. Revisa los análisis y el precio actual antes de comprar.",url:"https://www.residentevil.com/",store:"https://store.playstation.com/es-es/",color:"#39445c"},
{id:"silent",name:"Silent Hill f",genre:"Terror psicológico",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Terror psicológico con una ambientación inquietante y una historia misteriosa.",url:"https://www.konami.com/games/silenthill/",store:"https://store.playstation.com/es-es/",color:"#59404a"},
{id:"luto",name:"Luto",genre:"Terror / Indie",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Terror psicológico centrado en la exploración, la tensión y los espacios cotidianos.",url:"https://store.playstation.com/es-es/",store:"https://store.playstation.com/es-es/",color:"#4b4a39"},
{id:"outlast",name:"The Outlast Trials",genre:"Terror / Cooperativo",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Terror de supervivencia y pruebas perturbadoras; experiencia principalmente cooperativa.",url:"https://redbarrelsgames.com/",store:"https://store.playstation.com/es-es/",color:"#6a4937"},
{id:"lies",name:"Lies of P",genre:"Acción / Soulslike",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Combate exigente, ambientación oscura y jefes memorables.",url:"https://www.liesofp.com/",store:"https://store.playstation.com/es-es/",color:"#4b5666"},
{id:"witcher",name:"The Witcher 3: Wild Hunt",genre:"Acción / RPG",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Aventura de mundo abierto con misiones, monstruos y combate con espadas.",url:"https://www.thewitcher.com/",store:"https://store.playstation.com/es-es/",color:"#4a4a39"},
{id:"dredge",name:"DREDGE",genre:"Indie / Misterio",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Pesca, exploración y misterio con una inquietante capa de terror cósmico.",url:"https://www.dredge.game/",store:"https://store.playstation.com/es-es/",color:"#3d5360"},
{id:"forest",name:"The Forest",genre:"Supervivencia",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Supervivencia, exploración y amenazas en un bosque hostil. Comprueba la edición disponible en PS5.",url:"https://endnightgames.com/",store:"https://store.playstation.com/es-es/",color:"#46553c"},
{id:"outer",name:"Outer Wilds",genre:"Exploración / Indie",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Exploración espacial y misterio; mejor descubrir sus secretos sin spoilers.",url:"https://www.mobiusdigitalgames.com/outer-wilds.html",store:"https://store.playstation.com/es-es/",color:"#52645a"},
{id:"planet",name:"Planet of Lana II",genre:"Plataformas / Aventura",type:"Próximo lanzamiento",date:"Consultar fecha oficial",price:null,score:null,desc:"Aventura cinematográfica y plataformas con puzles y una fuerte identidad visual.",url:"https://store.playstation.com/es-es/",store:"https://store.playstation.com/es-es/",color:"#466b66"},
{id:"mafia",name:"Mafia III: Definitive Edition",genre:"Acción / Tercera persona",type:"Disponible",date:"Disponible",price:null,score:null,desc:"Acción narrativa en mundo abierto, con tiroteos y ambientación criminal.",url:"https://mafiagame.com/",store:"https://store.playstation.com/es-es/",color:"#5a463d"},
{id:"silver",name:"Silver Pines",genre:"Terror / Indie",type:"Por confirmar",date:"Consultar novedades",price:null,score:null,desc:"Indie de terror a seguir: confirma plataforma y fecha en fuentes oficiales.",url:"https://store.playstation.com/es-es/",store:"https://store.playstation.com/es-es/",color:"#4d5964"}
];
const tabs={inicio:"Tu radar",lanzamientos:"Calendario de lanzamientos",analisis:"Análisis y reseñas",ofertas:"Ofertas y precios",lista:"Mi lista"};
let tab="inicio", filter="Todos", search="", month="2026-10";
let saved=JSON.parse(localStorage.getItem("ps5radar_saved")||'["silent","lies","planet"]');
let targets=JSON.parse(localStorage.getItem("ps5radar_targets")||"{}");
function persist(){localStorage.setItem("ps5radar_saved",JSON.stringify(saved));localStorage.setItem("ps5radar_targets",JSON.stringify(targets))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function matches(g){let q=search.toLowerCase();let ok=!q||(g.name+" "+g.genre+" "+g.desc).toLowerCase().includes(q);let f=filter==="Todos"||g.genre.toLowerCase().includes(filter.toLowerCase());return ok&&f}
function gameCard(g){let isSaved=saved.includes(g.id);return `<article class="game"><div class="cover" style="background:linear-gradient(145deg,${g.color},#111723)"><span>${esc(g.name.toUpperCase())}</span></div><div class="gcontent"><div class="gtitle">${esc(g.name)}</div><div class="meta"><span class="tag">${esc(g.genre)}</span><span class="tag">${esc(g.type)}</span></div><p class="desc">${esc(g.desc)}</p><div class="actions"><a class="btn primary" href="${g.store}" target="_blank" rel="noopener">Ver en PS Store ↗</a><a class="btn" href="${g.url}" target="_blank" rel="noopener">Fuente / web ↗</a><button class="btn ${isSaved?"saved":""}" onclick="toggleSave('${g.id}')">${isSaved?"✓ En mi lista":"+ Mi lista"}</button></div></div></article>`}
function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();render()}
function monthOptions(){return `<select id="month" aria-label="Mes">${Array.from({length:15},(_,i)=>{let d=new Date(2026,9+i,1);let v=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");return `<option value="${v}" ${v===month?"selected":""}>${d.toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</option>`}).join("")}</select>`}

async function fetchLiveData(){
  const status=document.getElementById("liveStatus");
  try{
    const res=await fetch("/api/health",{cache:"no-store"});
    if(!res.ok) throw new Error("API no disponible");
    const health=await res.json();
    const [r1,r2,r3]=await Promise.all([
      fetch("/api/releases",{cache:"no-store"}),fetch("/api/reviews",{cache:"no-store"}),fetch("/api/offers",{cache:"no-store"})
    ]);
    if(!r1.ok||!r2.ok||!r3.ok) throw new Error("No se pudieron cargar todas las fuentes");
    const [releases,reviews,offers]=await Promise.all([r1.json(),r2.json(),r3.json()]);
    liveReleases=releases.items||[];liveReviews=reviews.items||[];liveOffers=offers.items||[];
    lastUpdated=new Date();
    apiErrors=[];
    if(status){status.textContent="● DATOS EN DIRECTO";status.style.color="var(--accent)";}
  }catch(e){
    apiErrors=[e.message];
    if(status){status.textContent="● FUENTES SIN CONECTAR";status.style.color="var(--gold)";}
  }
  if(document.getElementById("app")) render();
}
function liveCard(item, kind){
  const title=esc(item.title||"Sin título"), desc=esc(item.summary||item.genre||"Consulta la fuente para más información.");
  const date=item.date?`<span class="tag">${esc(item.date)}</span>`:"";
  const price=item.price?`<span class="tag green">${esc(item.price)}</span>`:"";
  const score=item.score?`<span class="tag green">${esc(item.score)}</span>`:"";
  const pct=item.discount?`<span class="tag green">${esc(item.discount)}</span>`:"";
  const source=esc(item.source||"Fuente");
  return `<article class="game"><div class="cover" style="background:linear-gradient(145deg,#394d62,#111723)"><span>${title.toUpperCase().slice(0,34)}</span></div><div class="gcontent"><div class="gtitle">${title}</div><div class="meta">${date}${price}${score}${pct}<span class="tag">${source}</span></div><p class="desc">${desc}</p><div class="actions"><a class="btn primary" href="${item.url||'#'}" target="_blank" rel="noopener">Abrir fuente ↗</a></div></div></article>`;
}
function livePanel(){
 return `<div class="panel"><h3>Conexión con fuentes públicas</h3><p>${lastUpdated?"Última consulta: "+lastUpdated.toLocaleString("es-ES"):"La app intentará consultar las fuentes cuando el servidor esté instalado."} ${apiErrors.length?"No hay conexión con el backend en esta dirección.":""}</p><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="fetchLiveData()">Actualizar ahora ↻</button><a class="btn" href="https://vandal.elespanol.com/lanzamientos/89/playstation-5" target="_blank">Vandal ↗</a><a class="btn" href="https://store.playstation.com/es-es/category/c48c22e2-5f2e-40e4-b946-8fdb97a0bc32/1" target="_blank">PS Store ↗</a></div></div>`;
}

function render(){
 const app=document.getElementById("app");
 let top=`<div class="welcome"><div class="eyebrow">PlayStation 5 · España</div><h2>Tu próximo juego<br>empieza aquí.</h2><p>Lanzamientos, análisis y ofertas en un solo lugar. Guarda juegos y define el precio al que te interesaría comprarlos.</p><div class="stats"><div class="stat"><b>${games.length}</b><span>Juegos en seguimiento</span></div><div class="stat"><b>${saved.length}</b><span>En mi lista</span></div><div class="stat"><b>3</b><span>Áreas principales</span></div></div></div>`;
 let searchBox=`<div class="searchrow"><input id="search" placeholder="Buscar juego o género…" value="${esc(search)}"><button class="btn" onclick="search='';render()">Limpiar</button></div><div class="chips">${["Todos","Terror","FPS","Acción","Plataformas","Indie","Supervivencia"].map(x=>`<button class="chip ${filter===x?"active":""}" onclick="filter='${x}';render()">${x}</button>`).join("")}</div>`;
 let content="";
 if(tab==="inicio"){
 content=top+livePanel()+`<div class="section-head"><h3>En tu radar</h3><button class="small-link" onclick="tab='lista';render()">Ver mi lista →</button></div>`+searchBox+`<div class="cards">${games.filter(matches).slice(0,6).map(gameCard).join("")}</div><div class="section-head"><h3>Fuentes útiles</h3></div><div class="panel"><h3>Calendario de lanzamientos</h3><p>Consulta las fechas y anuncios en PlayStation, Vandal y medios especializados.</p><div class="actions" style="margin-top:12px"><a class="btn" href="https://www.playstation.com/es-es/ps5/games/" target="_blank">PlayStation ↗</a><a class="btn" href="https://vandal.elespanol.com/lanzamientos/89/playstation-5" target="_blank">Vandal ↗</a><a class="btn" href="https://www.ign.com/" target="_blank">IGN ↗</a></div></div>`;
 }else if(tab==="lanzamientos"){
 content=`<div class="section-head"><h3>${tabs[tab]}</h3></div><div class="panel"><p>Selecciona un mes. Las fechas no verificadas se marcan como pendientes; esta versión inicial enlaza con calendarios externos y no descarga automáticamente un calendario en directo.</p><div class="monthbar" style="margin-top:12px">${monthOptions()}<a class="btn" href="https://vandal.elespanol.com/lanzamientos/89/playstation-5" target="_blank">Calendario completo ↗</a></div></div>`+`<div class="section-head"><h3>Resultados de fuentes conectadas</h3></div><div class="cards">${liveReleases.slice(0,40).map(x=>liveCard(x,"release")).join("")||""}</div>`+searchBox+`<div class="cards">${games.filter(g=>matches(g)&&g.type.toLowerCase().includes("próximo")||matches(g)&&g.type.toLowerCase().includes("confirm")).map(gameCard).join("")||'<div class="empty">No hay fechas verificadas en los datos iniciales para este mes. Consulta los calendarios enlazados.</div>'}</div><div class="notice">Las fechas y ventanas de lanzamiento deben comprobarse en fuentes oficiales: no se inventan fechas cuando no están confirmadas.</div>`;
 }else if(tab==="analisis"){
 content=`<div class="section-head"><h3>${tabs[tab]}</h3></div><div class="panel"><h3>Encuentra los análisis publicados</h3><p>Esta versión no rastrea automáticamente todos los medios todavía. Usa estos accesos y busca cada título para ver reseñas y notas publicadas.</p><div class="actions" style="margin-top:12px"><a class="btn primary" href="https://www.metacritic.com/game/" target="_blank">Metacritic ↗</a><a class="btn" href="https://vandal.elespanol.com/" target="_blank">Vandal ↗</a><a class="btn" href="https://www.eurogamer.es/" target="_blank">Eurogamer ↗</a><a class="btn" href="https://www.ign.com/" target="_blank">IGN ↗</a></div></div>`+`<div class="section-head"><h3>Análisis recientes de fuentes conectadas</h3></div><div class="cards">${liveReviews.slice(0,40).map(x=>liveCard(x,"review")).join("")||""}</div>`+searchBox+`<div class="cards">${games.filter(matches).map(g=>`<article class="game"><div class="cover" style="background:linear-gradient(145deg,${g.color},#111723)"><span>${esc(g.name.toUpperCase())}</span></div><div class="gcontent"><div class="gtitle">${esc(g.name)}</div><div class="meta"><span class="tag">${esc(g.genre)}</span><span class="tag">Notas: por consultar</span></div><p class="desc">Consulta las reseñas disponibles; no se muestra una nota inventada.</p><div class="actions"><a class="btn primary" href="https://www.google.com/search?q=${encodeURIComponent(g.name+" PS5 análisis review")}" target="_blank">Buscar análisis ↗</a><button class="btn ${saved.includes(g.id)?"saved":""}" onclick="toggleSave('${g.id}')">${saved.includes(g.id)?"✓ En mi lista":"+ Mi lista"}</button></div></div></article>`).join("")}</div>`;
 }else if(tab==="ofertas"){
 content=`<div class="section-head"><h3>${tabs[tab]}</h3></div><div class="section-head"><h3>Ofertas detectadas en la tienda</h3></div><div class="cards">${liveOffers.slice(0,50).map(x=>liveCard(x,"offer")).join("")||""}</div><div class="panel"><h3>Control de precio personal</h3><p>Define el precio máximo que pagarías por un juego. En esta versión queda guardado en este dispositivo; todavía no genera alertas automáticas de precio.</p></div>`+`<div class="section-head"><h3>Análisis recientes de fuentes conectadas</h3></div><div class="cards">${liveReviews.slice(0,40).map(x=>liveCard(x,"review")).join("")||""}</div>`+searchBox+`<div class="cards">${games.filter(matches).map(g=>`<article class="game"><div class="cover" style="background:linear-gradient(145deg,${g.color},#111723)"><span>${esc(g.name.toUpperCase())}</span></div><div class="gcontent"><div class="gtitle">${esc(g.name)}</div><div class="meta"><span class="tag">Precio en vivo: no conectado</span></div><p class="desc">Consulta el precio actual y el historial antes de comprar.</p><div class="setting"><label>Mi precio objetivo (€)</label><input type="number" min="0" step="0.50" placeholder="Ej. 19,99" value="${targets[g.id]??""}" onchange="targets['${g.id}']=this.value;persist()"></div><div class="actions"><a class="btn primary" href="https://psprices.com/region-es/search/?q=${encodeURIComponent(g.name)}" target="_blank">Ver precio / historial ↗</a><a class="btn" href="${g.store}" target="_blank">PS Store ↗</a></div></div></article>`).join("")}</div><div class="notice">Las ofertas proceden de la extracción pública del catálogo oficial cuando está disponible. Los cambios de la web pueden romper la extracción; verifica siempre el precio final en PS Store.</div>`;
 }else{
 content=`<div class="section-head"><h3>Mi lista de seguimiento</h3></div><p style="color:var(--muted);font-size:12px;margin:0 2px 14px">Los juegos que guardes se quedan en este navegador.</p><div class="cards">${games.filter(g=>saved.includes(g.id)&&matches(g)).map(gameCard).join("")||'<div class="empty">Todavía no hay juegos aquí. Pulsa “+ Mi lista” en cualquier título para guardarlo.</div>'}</div>`;
 }
 app.innerHTML=(tab==="inicio"?"":`<div class="eyebrow" style="margin:3px 2px 8px">PS5 RADAR</div>`)+content+`<div class="footer">PS5 Radar · Prototipo personal · Los enlaces externos pertenecen a sus respectivos propietarios.</div>`;
 const si=document.getElementById("search");if(si)si.addEventListener("input",e=>{let p=si.selectionStart;search=e.target.value;let pos=window.scrollY;render();let next=document.getElementById("search");next.focus();next.setSelectionRange(p,p);window.scrollTo(0,pos)});
 const mo=document.getElementById("month");if(mo)mo.addEventListener("change",e=>{month=e.target.value;render()});
 document.querySelectorAll(".nav button").forEach(b=>{b.classList.toggle("active",b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;filter="Todos";search="";render()}});
}
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
fetchLiveData();
setInterval(fetchLiveData, 30*60*1000);
</script>
</body></html>
